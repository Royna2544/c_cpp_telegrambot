name: Build Glider (Multi-Platform)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # upload vcpkg binaries to the GitHub Packages NuGet cache

jobs:
  build:
    name: 🚧 ${{ matrix.os }} ${{ matrix.cc }} ${{ matrix.str }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux Builds ---
          - os: ubuntu-latest
            cc: GCC
            real_cc: gcc
            real_cxx: g++
            flags: -DTGBOTCPP_RUST_MODULES=ON
            str: (Rust)
          - os: ubuntu-latest
            cc: GCC
            real_cc: gcc
            real_cxx: g++
            flags: '-DBUILD_SHARED_LIBS=ON'
            str: (Shared)
          - os: ubuntu-latest
            cc: Clang
            real_cc: clang
            real_cxx: clang++
            flags: -DTGBOTCPP_RUST_MODULES=ON -DBUILD_SHARED_LIBS=ON
            str: (Rust, Shared)
          - os: ubuntu-latest
            cc: Clang
            real_cc: clang
            real_cxx: clang++
            flags: ''
          - os: ubuntu-latest
            cc: GCC-ASan-UBSan
            real_cc: gcc
            real_cxx: g++
            flags: '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined'
            str: (ASan, UBSan)
            asan_options: detect_leaks=0:halt_on_error=1
            ubsan_options: halt_on_error=1:print_stacktrace=1
          - os: ubuntu-latest
            cc: GCC-TSan
            real_cc: gcc
            real_cxx: g++
            flags: '-DCMAKE_C_FLAGS=-fsanitize=thread -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread'
            str: (TSan)
            # vcpkg dependencies are not built with this target's sanitizer
            # flags. Keep the documented Pango/GLib/fontconfig suppressions at
            # exact external symbols while halting on every other race.
            tsan_options: halt_on_error=1:suppressions=tsan-pango.supp
          - os: ubuntu-latest
            cc: GCC-ARMHF
            real_cc: arm-linux-gnueabihf-gcc
            real_cxx: arm-linux-gnueabihf-g++
            # Matrix strings are not recursively expression-expanded. Use the
            # runner's shell variable so these paths do not collapse to /CMake.
            flags: '-DVCPKG_TARGET_TRIPLET=arm-linux-release -DVCPKG_INSTALL_OPTIONS=--allow-unsupported -DVCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/CMake/triplets -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/CMake/toolchains/toolchain-armhf.cmake'
            features: 'image;database;luamodules;backtrace;web'
            build_tests: 'OFF'
            cross: true
          
          # --- macOS Build ---
          - os: macos-latest
            cc: AppleClang
            real_cc: clang
            real_cxx: clang++
            flags: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          - os: macos-latest
            cc: AppleClang
            real_cc: clang
            real_cxx: clang++
            flags: -DBUILD_SHARED_LIBS=ON -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
            str: (Shared)

          # --- Windows Build ---
          - os: windows-latest
            cc: MSVC
            real_cc: cl.exe
            real_cxx: cl.exe
            flags: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          # Cache key depends on OS, compiler, and the vcpkg.json file
          key: vcpkg-${{ matrix.os }}-${{ matrix.cc }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ matrix.cc }}-

      - uses: maxim-lobanov/setup-xcode@v1
        if: matrix.os == 'macos-latest'
        with:
          xcode-version: latest-stable

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Install Build Dependencies (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y autoconf autoconf-archive automake libtool libxrandr-dev \
            libx11-dev libxft-dev libxext-dev libltdl-dev libxi-dev libxtst-dev \
            x11-xserver-utils gi-docgen nasm mono-complete gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf libc6-dev-armhf-cross

      - name: Install Build Dependencies (macOS Only)
        if: matrix.os == 'macos-latest'
        run: brew install autoconf autoconf-archive automake libtool

      - name: Select vcpkg binary cache sources
        shell: bash
        run: |
          # Layer 1: a fast per-runner files cache (actions/cache; evicts at the
          # 10 GB / 7-day limit). Layer 2: a persistent NuGet cache on GitHub
          # Packages so heavy ports (grpc, opencv) survive eviction.
          FILES="files,${{ github.workspace }}/vcpkg_cache,readwrite"
          if [ "$RUNNER_OS" = "macOS" ]; then
            # macOS runners are arm64, where vcpkg sets VCPKG_FORCE_SYSTEM_BINARIES
            # and therefore refuses to download the nuget CLI. A nuget source in
            # VCPKG_BINARY_SOURCES then fails `vcpkg install` outright, so use the
            # files cache only here.
            echo "VCPKG_BINARY_SOURCES=clear;$FILES" >> "$GITHUB_ENV"
          else
            FEED="nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"
            echo "VCPKG_BINARY_SOURCES=clear;$FILES;$FEED" >> "$GITHUB_ENV"
          fi

      - name: Set up vcpkg NuGet binary cache (GitHub Packages)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            VCPKG_EXE="$VCPKG_ROOT/vcpkg.exe"; MONO=""
          else
            VCPKG_EXE="$VCPKG_ROOT/vcpkg"; MONO="mono"
          fi
          FEED="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          # The NuGet binary cache is an optimization; never let setting it up
          # abort the build. Run `vcpkg fetch nuget` plainly so its output is
          # visible (capturing it into a command substitution previously hid the
          # error and exited 1 silently), and bail out gracefully on any problem.
          if ! NUGET_OUT="$("$VCPKG_EXE" fetch nuget 2>&1)"; then
            echo "$NUGET_OUT"
            echo "::warning::vcpkg fetch nuget failed; skipping NuGet binary cache"
            exit 0
          fi
          NUGET="$(printf '%s\n' "$NUGET_OUT" | tail -n1)"

          if [ -n "$MONO" ] && ! command -v mono >/dev/null 2>&1; then
            echo "::warning::mono not found; skipping NuGet binary cache"
            exit 0
          fi

          # Tolerate failures (e.g. fork PRs whose GITHUB_TOKEN cannot write to
          # GitHub Packages) — the local files cache still works.
          $MONO "$NUGET" sources add -Source "$FEED" -StorePasswordInClearText \
            -Name GitHubPackages -UserName "${{ github.repository_owner }}" \
            -Password "${{ secrets.GITHUB_TOKEN }}" || true
          $MONO "$NUGET" setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "$FEED" || true

      - name: Configure CMake
        shell: bash
        env:
          CC: ${{ matrix.real_cc }}
          CXX: ${{ matrix.real_cxx }}
        run: |
          # Use different path syntax for Windows toolchain if needed
          VCPKG_PATH="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

          # Keep pull requests on the same feature surface as master so image
          # backend regressions cannot merge without being compiled and tested.
          FEATURES="${{ matrix.features }}"
          if [ -z "$FEATURES" ]; then
            FEATURES="image-opencv;image;database;luamodules;testing;backtrace;web"
          fi

          # Cross compilers come from the chainloaded target toolchain. Do not
          # leak them into vcpkg's native host-tool builds (x64-linux), where
          # they would be combined with host flags such as -m64.
          if [ "${{ matrix.cross }}" = "true" ]; then
            unset CC CXX
          fi

          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_PATH" \
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON \
            -DVCPKG_MANIFEST_FEATURES="$FEATURES" \
            -DTGBOTCPP_BUILD_TESTS=${{ matrix.build_tests || 'ON' }} \
            ${{ matrix.flags }}

      - name: Build project
        run: |
          cmake --build build --config Release
          cmake --build build --config Release --target optional_all

      - name: Run Tests
        if: matrix.cross != true
        shell: bash
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          TSAN_OPTIONS: ${{ matrix.tsan_options }}
        run: |
          cd build
          ctest -C Release --output-on-failure --timeout 60

      - name: Package (CPack smoke test)
        shell: bash
        working-directory: build
        run: cpack -C Release

      - name: Upload packages
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: glider-${{ matrix.os }}-${{ matrix.cc }}-${{ strategy.job-index }}
          path: |
            build/Glider-*.zip
            build/Glider-*.tar.gz
            build/Glider-*.exe
            build/Glider-*.deb
          if-no-files-found: ignore

  rust-quality:
    name: Rust tests and Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api/builtin_modules/builder/builder-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/api/builtin_modules/builder/builder-rs
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets --locked
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  source-hygiene:
    name: Source and configuration validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Validate scripts, JSON, and source text
        shell: bash
        run: |
          python3 -m compileall -q resources/scripts
          find resources/scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          python3 -c 'import json,pathlib; [json.loads(p.read_text(encoding="utf-8")) for p in pathlib.Path(".").rglob("*.json") if "src/third-party" not in p.as_posix() and "vcpkg_installed" not in p.as_posix()]'
          python3 -c 'import pathlib,sys; suffixes={".c",".cc",".cpp",".h",".hpp"}; bad=[str(p) for p in pathlib.Path("src").rglob("*") if p.suffix in suffixes and "third-party" not in p.parts and b"\0" in p.read_bytes()]; print("Embedded NUL byte found in: " + ", ".join(bad), file=sys.stderr) if bad else None; sys.exit(bool(bad))'
